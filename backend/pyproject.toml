[project]
name = "ai-data-analyst-backend"
version = "0.1.0"
description = "Full Stack AI Data Analyst backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "reportlab>=4.2,<5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
"app/api/v1/*.py" = ["B008"]