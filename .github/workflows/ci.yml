name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --project backend --python 3.12 --locked

      - name: Ruff lint
        run: uv run --project backend ruff check backend/app backend/tests

      - name: Backend tests
        run: uv run --project backend pytest -q

  frontend:
    name: Frontend / React
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Frontend tests
        run: npm --prefix frontend run test

      - name: TypeScript and production build
        run: npm --prefix frontend run build
